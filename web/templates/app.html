<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cifra</title>
  {{ .inertiaHead }}
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <meta name="theme-color" content="#121816" />
  <link rel="icon" href="/static/icons/icon.png" type="image/png" />
  <script>
    try {
      if (localStorage.getItem('cifra-theme') === 'light') {
        document.documentElement.classList.add('light')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f1e2')
      }
    } catch (e) {}
  </script>
</head>
<body>
  {{ .inertia }}
  <script type="module" src="/static/build/assets/main.js"></script>
</body>
</html>
